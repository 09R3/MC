    const p = el("path", { d: res.d, "data-kind": sign === 0 ? "traced" : "outline", "fill-rule": "evenodd" });
    p.setAttribute("data-label", sign === 0 ? "Traced" : sign > 0 ? "Outline" : "Inset");
    setMat(p, new DOMMatrix());
    addObject(p, { op: opIdx });
    if (replace) nodes.forEach(n => n.remove());
    select(p); after(); renderLayers();
    const dropped = res.dropped ? `, ${res.dropped} dropped` : "";
    toast(sign === 0
      ? `Traced — ${res.count} contour${res.count === 1 ? "" : "s"}${dropped}`
      : `${sign > 0 ? "Outline" : "Inset"} at ${raw} ${S.unit} — ${res.count} contour${res.count === 1 ? "" : "s"}${dropped}`);
  } catch (err) {
    toast(err.message || "Trace failed");
  } finally { busy(false); }
}

/* ============================================================
   Export
   ============================================================ */
function exportSVG() {
  if (!content.children.length) { toast("Bed is empty — nothing to export"); return; }
  const full = document.querySelector("#exFull")?.checked ?? true;
  const hair = document.querySelector("#exHair")?.checked ?? true;
  const clone = content.cloneNode(true);
  clone.removeAttribute("id");
  [...clone.querySelectorAll("*")].forEach(n => { if (n.style && n.style.display === "none") n.remove(); });
  clone.querySelectorAll("*").forEach(n => {
    [...n.attributes].forEach(a => { if (/^data-/.test(a.name)) n.removeAttribute(a.name); });
    n.removeAttribute("vector-effect");
    if (hair && n.getAttribute("stroke") && n.getAttribute("stroke") !== "none") n.setAttribute("stroke-width", 0.96);
  });
  clone.removeAttribute("data-id");

  let vbx = 0, vby = 0, vbw = S.bedW * PPI, vbh = S.bedH * PPI;
  if (!full) {
    const b = aabbOf(objects());
    if (b) { vbx = b.x - 2; vby = b.y - 2; vbw = b.width + 4; vbh = b.height + 4; }
  }
  const wIn = (vbw / PPI).toFixed(4), hIn = (vbh / PPI).toFixed(4);
  const usesCustom = S.fonts.some(f => clone.querySelector(`[font-family*="${f.family}"]`));
  const fontCSS = usesCustom ? `<defs><style type="text/css"><![CDATA[${fontFaceCSS()}]]></style></defs>` : "";
  const body = fontCSS + new XMLSerializer().serializeToString(clone);
  const svg = `<?xml version="1.0" encoding="UTF-8"?>
<!-- LaserNode export · ${wIn} x ${hIn} in · 96 units per inch -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="${wIn}in" height="${hIn}in" viewBox="${vbx.toFixed(2)} ${vby.toFixed(2)} ${vbw.toFixed(2)} ${vbh.toFixed(2)}">
${body}
</svg>`;
  const blob = new Blob([svg], { type: "image/svg+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `lasernode-${new Date().toISOString().slice(0, 10)}.svg`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  const ops = [...usedColors().keys()];
  toast(`Exported ${wIn} × ${hIn} in · ${ops.length} colour${ops.length === 1 ? "" : "s"} = ${ops.length} step${ops.length === 1 ? "" : "s"} in the Glowforge app`, 4200);
}

/* ============================================================
   Chrome wiring + keyboard
   ============================================================ */
let spaceDown = false;
document.querySelectorAll(".tool").forEach(b => b.onclick = () => setTool(b.dataset.tool));
$("#btnOpen").onclick = () => $("#filein").click();
$("#filein").onchange = e => { handleFiles(e.target.files); e.target.value = ""; };
$("#fontin").onchange = e => { [...e.target.files].forEach(loadFontFile); e.target.value = ""; };
$("#btnNew").onclick = () => {
  if (content.children.length && !confirm("Clear the bed? This can't be undone with Ctrl+Z.")) return;
  content.textContent = ""; S.undo.length = 0; S.redo.length = 0;
  S.proj = { id: null, name: "Untitled", dirty: false }; renderTitle();
  S.scope = null; S.expanded.clear(); setSub([]); renderCrumb(); select([]); after(); renderLayers();
};
$("#btnSave").onclick = () => saveProject(false);
$("#btnOpenProj").onclick = showProjects;
$("#mClose").onclick = () => $("#modal").classList.remove("on");
$("#modal").onclick = e => { if (e.target === $("#modal")) $("#modal").classList.remove("on"); };
async function showProjects() {
  await refreshProjects();
  const box = $("#projRows");
  box.innerHTML = S.projList.length ? S.projList.map(p => `
    <div class="prow" data-open="${p.id}">
      <span class="pn">${esc(p.name)}<em>${p.objects} object${p.objects === 1 ? "" : "s"} · ${new Date(p.updated).toLocaleString()}</em></span>
      <button class="del" data-del="${p.id}" data-name="${esc(p.name)}" title="Delete">✕</button>
    </div>`).join("")
    : `<p class="empty" style="padding:10px 4px">No saved projects yet. Build something and hit Save.</p>`;
  box.querySelectorAll("[data-open]").forEach(r => r.onclick = e => {
    if (e.target.closest("[data-del]")) return;
    if (S.proj.dirty && !confirm("You have unsaved changes. Open anyway?")) return;
    $("#modal").classList.remove("on");
    openProject(r.dataset.open);
  });
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = async e => {
    e.stopPropagation();
    await deleteProject(b.dataset.del, b.dataset.name);
    showProjects();
  });
  $("#modal").classList.add("on");
}
$("#btnUndo").onclick = undo;
$("#btnRedo").onclick = redo;
$("#btnFit").onclick = fitView;
$("#btnExport").onclick = exportSVG;
$("#snapSel").onchange = e => {
  const v = parseFloat(e.target.value) || 0;
  S.snap = v > 0 ? (S.unit === "in" ? v * PPI : v * PPI) : 0;
  toast(v > 0 ? `Snapping to ${S.unit === "in" ? v + '"' : (v * MM).toFixed(1) + " mm"} — hold Alt to override` : "Snap off");
};
function rebuildSnapOptions() {
  const sel = $("#snapSel"); if (!sel) return;
  const cur = sel.value;
  const opts = S.unit === "in"
    ? [["0","off"],["0.0625",'1/16"'],["0.125",'1/8"'],["0.25",'1/4"'],["0.5",'1/2"'],["1",'1"']]
    : [["0","off"],["0.0393701","1 mm"],["0.0787402","2 mm"],["0.1968504","5 mm"],["0.3937008","10 mm"],["0.9842520","25 mm"]];
  sel.innerHTML = opts.map(([v,l]) => `<option value="${v}">${l}</option>`).join("");
  sel.value = opts.some(o => o[0] === cur) ? cur : "0";
  S.snap = (parseFloat(sel.value) || 0) * PPI;
}
$("#unitSel").onchange = e => { S.unit = e.target.value; sizeBed(); applyView(); renderInspector(); };
$("#bedSel").onchange = e => {
  const v = e.target.value;
  if (v === "custom") {
    const s = prompt(`Bed size in ${S.unit}, as "width x height"`,
      S.unit === "in" ? `${S.bedW} x ${S.bedH}` : `${(S.bedW*MM).toFixed(0)} x ${(S.bedH*MM).toFixed(0)}`);
    if (!s) return;
    const p = s.split(/[x\u00d7,]/).map(t => parseFloat(t));
    if (p.length !== 2 || !p.every(isFinite) || p.some(n => n <= 0)) { toast("Couldn't read that size"); return; }
    S.bedW = S.unit === "in" ? p[0] : p[0] / MM;
    S.bedH = S.unit === "in" ? p[1] : p[1] / MM;
  } else { const p = v.split("x"); S.bedW = +p[0]; S.bedH = +p[1]; }
  sizeBed(); fitView(); updateStatus();
};

["dragenter", "dragover"].forEach(ev => viewport.addEventListener(ev, e => {
  e.preventDefault(); $("#dropveil").classList.add("on");
}));
["dragleave", "drop"].forEach(ev => viewport.addEventListener(ev, e => {
  e.preventDefault(); if (ev === "drop" || !viewport.contains(e.relatedTarget)) $("#dropveil").classList.remove("on");
}));
viewport.addEventListener("drop", e => { e.preventDefault(); handleFiles(e.dataTransfer.files); });

addEventListener("keydown", e => {
  const t = e.target.tagName;
  const typing = t === "INPUT" || t === "TEXTAREA" || t === "SELECT";
  if (e.code === "Space" && !typing) { spaceDown = true; viewport.classList.add("panning"); e.preventDefault(); }
  if (typing) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveProject(e.shiftKey); }
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); saveProject(e.shiftKey); return; }
  if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === "a") { e.preventDefault(); selectAll(); return; }
  if (mod && e.key.toLowerCase() === "d") { e.preventDefault(); duplicateSel(); return; }
  if (mod && e.key.toLowerCase() === "g") { e.preventDefault(); e.shiftKey ? ungroupSel() : groupSel(); return; }
  if (mod && e.key === "0") { e.preventDefault(); fitView(); return; }
  if (mod) return;
  if (e.key === "Escape") {
    if (S.sub.length) { setSub([]); return; }
    if (S.scope) { setScope(S.scope.parentNode === content ? null : S.scope.parentNode); select([]); renderLayers(); drawOverlay(); return; }
    select([]); setTool("select"); return;
  }
  if (e.key === "Delete" || e.key === "Backspace") {
    if (S.sub.length) { e.preventDefault(); subDelete(); return; }
    if (!S.sel.length) return;
    e.preventDefault(); snapshot(); S.sel.forEach(n => n.remove()); select([]); after(); return;
  }
  if (e.shiftKey && S.sel.length && (e.key === "H" || e.key === "V")) {
    e.preventDefault(); e.key === "H" ? flipH() : flipV(); return;
  }
  if (e.key === "[" || e.key === "]") { if (S.sel.length) { e.preventDefault(); rot90(e.key === "]" ? 1 : -1); } return; }
  if (e.key.startsWith("Arrow") && S.sel.length) {
    e.preventDefault();
    const step = S.snap > 0 && !e.altKey ? S.snap
      : fromU(S.unit === "in" ? (e.shiftKey ? 0.1 : 0.01) : (e.shiftKey ? 2 : 0.5));
    const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    snapshot(); applyMat(new DOMMatrix().translate(d[0], d[1]));
    drawOverlay(); syncNumbers(); updateStatus(); return;
  }
  const map = { v: "select", t: "text", r: "rect", e: "ellipse", l: "line", p: "poly", h: "pan", a: "lasso" };
  if (map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);
});
addEventListener("keyup", e => {
  if (e.code === "Space") { spaceDown = false; viewport.classList.remove("panning"); }
});
// drag the divider between the layer list and the inspector
(() => {
  const sp = $("#splitter"); if (!sp) return;
  let dragging = false;
  sp.addEventListener("pointerdown", e => { dragging = true; sp.setPointerCapture(e.pointerId); e.preventDefault(); });
  sp.addEventListener("pointermove", e => {
    if (!dragging) return;
    const r = $("#right").getBoundingClientRect();
    const pct = clamp((e.clientY - r.top) / r.height * 100, 12, 80);
    document.documentElement.style.setProperty("--layh", pct + "%");
  });
  sp.addEventListener("pointerup", () => { dragging = false; });
})();

addEventListener("resize", resizeStage);

/* ---------- go ---------- */
buildStage();
renderCrumb();
resizeStage();
fitView();
renderInspector();
updateStatus();
$("#btnUndo").disabled = true;
$("#btnRedo").disabled = true;
detectServer();
addEventListener("beforeunload", e => { if (S.proj.dirty && content.children.length) { e.preventDefault(); e.returnValue = ""; } });
setTimeout(() => toast("Drop an SVG on the bed, or draw something. Colours become Glowforge steps.", 4500), 500);

</script>
</body>
